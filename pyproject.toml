[project]
name = "ajera-mcp"
version = "2.1.0"
description = "Read-only MCP server for the Deltek Ajera API"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
ajera-mcp = "server:mcp.run"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "ajera_client.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
